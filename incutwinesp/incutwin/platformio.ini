; IncuTwin — PlatformIO Configuration
; Medicina Abierta al Mundo (MOW)
; Platform: ESP32 / Arduino framework

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-11101
monitor_port = /dev/cu.usbserial-11101

lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^6.21.0
    thingsboard/ThingsBoard @ ^0.9.0
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION='"1.0.0"'
    -DPHASE=1

[env:esp32dev_phase2]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION='"1.0.0"'
    -DPHASE=2

[env:esp32dev_phase3]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION='"1.0.0"'
    -DPHASE=3

[env:esp32dev_test]
extends = env:esp32dev
test_framework = unity
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION='"1.0.0"'
    -DPHASE=1
